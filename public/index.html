<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backing Track Builder</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="setup" class="setup" hidden>
    <h1>Backing Track Builder</h1>
    <p class="warn">No samples imported yet.</p>
    <p>Run this in the project folder, then reload the page:</p>
    <pre>npm run import-samples -- "/path/to/Click and Guide Samples"</pre>
  </section>

  <div id="app" class="app">
    <header id="controlbar" class="controlbar" aria-label="Control bar"></header>
    <aside id="browser" class="browser" aria-label="Browser"></aside>
    <main id="arrangement" class="arrangement" aria-label="Arrangement"></main>
    <main id="session" class="session" aria-label="Session" hidden></main>
    <section id="detail" class="detail" aria-label="Detail"></section>
    <footer id="statusbar" class="statusbar" aria-live="polite"></footer>
    <div id="notice" class="notice" role="alert" hidden></div>
    <input id="import-files" type="file" multiple hidden>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
